name: CS000O EV-04 ledger closure

on:
  push:
    branches:
      - agent/cs000o-ev04-ledger-closure
    paths:
      - '.github/workflows/cs000o-ev04-ledger-closure-validation.yml'
      - 'audit/EVOLUTION_REQUIREMENTS_TRACEABILITY.json'
      - 'audit/EVOLUTION_ROADMAP.json'
      - 'audit/validation/CS000O/VALIDATION_PLAN.json'
      - 'docs/changesets/000O/CHANGESET.md'
      - 'docs/changesets/000O/evidence/EV04_ACCEPTANCE_MANIFEST.json'
      - 'docs/records/evolution/DEV-0015.md'
      - 'scripts/verify_cs000o_ev04_ledger_closure.py'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate:
    name: CS000O EV-04 ledger closure
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact CS000O source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000O verifier negative self-test
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --self-test

      - name: Verify prospective EV-04 closure authority
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --authority

      - name: Verify accepted CS021 protected integration
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --integration

      - name: Verify live CS021 and protected provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --github

      - name: Verify accepted CS000N closure authorization
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --cs000n

      - name: Verify preserved EV-04 technical evidence
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --technical-evidence

      - name: Verify exact EV-04 ledger closure
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --ledger

      - name: Verify EVREQ-016 through EVREQ-018
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --requirements

      - name: Verify EV-04 acceptance evidence and decision
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --acceptance

      - name: Verify CS000O source descriptor geometry
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --descriptor

      - name: Verify exact CS000O administrative-only scope
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --scope

      - name: Verify no product EV-05 or release effects
        run: python3 -B scripts/verify_cs000o_ev04_ledger_closure.py --non-effects

      - name: Verify evolution ledger
        run: |
          python3 -B scripts/verify_evolution_plan.py
          python3 -B scripts/verify_evolution_plan.py --self-test

      - name: Verify tracked-file manifest
        run: python3 -B scripts/generate_manifest.py --check

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000O/VALIDATION_PLAN.json
          --expected-base-sha 08ae1545b68d99575e0ddadf76398055c84bb84e

name: CS000J EV-01 ledger closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cs000i-ev00-ledger-closure-validation.yml'
      - '.github/workflows/cs000j-ev01-ledger-closure-validation.yml'
      - 'scripts/verify_cs000j_ev01_ledger_closure.py'
      - 'audit/EVOLUTION_ROADMAP.json'
      - 'audit/EVOLUTION_REQUIREMENTS_TRACEABILITY.json'
      - 'audit/validation/CS000J/VALIDATION_PLAN.json'
      - 'docs/changesets/000J/CHANGESET.md'
      - 'docs/changesets/000J/evidence/EV01_ACCEPTANCE_MANIFEST.json'
      - 'docs/records/evolution/DEV-0008.md'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate:
    name: CS000J EV-01 ledger closure
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000J verifier negative self-test
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --self-test

      - name: Verify prospective governance authority
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --authority

      - name: Verify accepted CS018 integration binding
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --integration

      - name: Verify live CS018 and post-merge provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --github

      - name: Verify CS000I workflow is manual-only
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --workflow-retirement

      - name: Verify exact EV-01 ledger closure
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --ledger

      - name: Verify EVREQ-005 through EVREQ-008
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --requirements

      - name: Verify EV-01 acceptance evidence and decision
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --evidence

      - name: Verify CS000J administrative-only scope
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --scope

      - name: Verify no product release or EV-02 effects
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --non-effects

      - name: Verify evolution ledger
        run: |
          python3 -B scripts/verify_evolution_plan.py
          python3 -B scripts/verify_evolution_plan.py --self-test

      - name: Verify tracked-file manifest
        run: python3 -B scripts/verify_cs000j_ev01_ledger_closure.py --manifest

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000J/VALIDATION_PLAN.json
name: CS000K EV-02 ledger closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cs000j-ev01-ledger-closure-validation.yml'
      - '.github/workflows/cs000k-ev02-ledger-closure-validation.yml'
      - 'scripts/verify_cs000k_ev02_ledger_closure.py'
      - 'audit/EVOLUTION_ROADMAP.json'
      - 'audit/EVOLUTION_REQUIREMENTS_TRACEABILITY.json'
      - 'audit/validation/CS000K/VALIDATION_PLAN.json'
      - 'docs/changesets/000K/CHANGESET.md'
      - 'docs/changesets/000K/evidence/EV02_ACCEPTANCE_MANIFEST.json'
      - 'docs/records/evolution/DEV-0010.md'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate:
    name: CS000K EV-02 ledger closure
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000K verifier negative self-test
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --self-test

      - name: Verify prospective governance authority
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --authority

      - name: Verify accepted CS019 integration binding
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --integration

      - name: Verify preserved net-zero post-acceptance recovery
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --recovery

      - name: Verify live CS019 and post-merge provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --github

      - name: Verify CS000J workflow is manual-only
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --workflow-retirement

      - name: Verify exact EV-02 ledger closure
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --ledger

      - name: Verify EVREQ-009 through EVREQ-012
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --requirements

      - name: Verify EV-02 acceptance evidence and decision
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --evidence

      - name: Verify CS000K administrative-only scope
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --scope

      - name: Verify no product release or EV-03 effects
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --non-effects

      - name: Verify evolution ledger
        run: |
          python3 -B scripts/verify_evolution_plan.py
          python3 -B scripts/verify_evolution_plan.py --self-test

      - name: Verify tracked-file manifest
        run: python3 -B scripts/verify_cs000k_ev02_ledger_closure.py --manifest

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000K/VALIDATION_PLAN.json
          --expected-base-sha 9e35c25fd4c618d4707067f8760712c549f01a3e

name: EV-00 D-Lab evidence validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/dlab/ev00/**'
      - '.github/workflows/ev00-dlab.yml'
      - 'docs/changesets/017/**'
      - 'audit/validation/CS017/**'
      - 'audit/CURRENT_CHANGESET_VALIDATION.json'
      - 'audit/EVOLUTION_ROADMAP.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: EV-00 D-Lab evidence validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify R16 stage scope and R9-R15 preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, fnmatch, json, subprocess
          from pathlib import Path
          BASE='3ebb989c5aaca65501ddbc5e552e1f751079e310'; PRODUCT='e3fff973554a2e56b8bd7afdc1132f75f3ec337c'
          def read(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def base(p): return json.loads(subprocess.run(['git','show',f'{BASE}:{p}'],text=True,capture_output=True,check=True).stdout)
          def st(d): return next(x for x in d['stages'] if x['stage_id']=='EV-00')
          b=base('audit/EVOLUTION_ROADMAP.json'); c=read('audit/EVOLUTION_ROADMAP.json')
          if st(b)['status']!='not_started' or st(c)['status']!='in_progress': raise SystemExit('EV-00 lifecycle mismatch')
          n=copy.deepcopy(c); st(n)['status']='not_started'
          if n!=b or c.get('release_authorized') is not False: raise SystemExit('roadmap drift outside EV-00 start')
          scope=read('docs/changesets/017/ACTION_SCOPE.json')
          if scope.get('control_base_commit')!=BASE or scope.get('source_under_test',{}).get('commit')!=PRODUCT: raise SystemExit('scope binding mismatch')
          preds={x['revision']:x for x in scope.get('predecessor_attempts',[])}
          if set(preds)!={'R9','R10','R11','R12','R13','R14','R15'} or any(x.get('reusable_as_qualifying_evidence') is not False for x in preds.values()): raise SystemExit('predecessor preservation mismatch')
          r15=read('docs/changesets/017/R15_STATIC_VALIDATION_FAILURE.json')
          if r15.get('classification')!='FAILED_NONQUALIFYING_STATIC_VALIDATION_VERIFIER_SELF_TEST_FIXTURE_SCHEMA_MISMATCH' or r15.get('canonical_plan_commit')!='a8b5d3f49e0c34097581f18d6b16aa2d3a2a2113' or r15.get('physical_qualify_executed') is not False or r15.get('reusable_as_qualifying_evidence') is not False: raise SystemExit('R15 failure record mismatch')
          hashes={
            'docs/changesets/017/R5_FAILURE_RECORD.json':'02012335696e2fcfeba1516f61f79e15cdd588c5','docs/changesets/017/R6_FAILURE_RECORD.json':'9906b34cc95b50fec8665d482ce77b89a9c304fb','docs/changesets/017/R7_PREPARATION_RECORD.json':'a794910318fe4e8bec38eb804e7e5a011a05c979','docs/changesets/017/R9_PHYSICAL_ATTEMPT1_FAILURE.json':'5bc1b418e60628eb5ff3ec8eee8b3a07e25151ac','docs/changesets/017/R10_PHYSICAL_ATTEMPT1_FAILURE.json':'b154581380797389610fca45b49333d867cbbe0a','docs/changesets/017/R11_PHYSICAL_ATTEMPT1_FAILURE.json':'58eeab7d08beaa0b4f89ce54098eafa13e06927d','docs/changesets/017/R12_STATIC_VALIDATION_FAILURE.json':'857fdce7fdc9401f46687dc4d1a0751485d62155','docs/changesets/017/R13_PHYSICAL_ATTEMPT1_FAILURE.json':'7cc94c43dd6311e192125cdc5baccd3476eeffa8','docs/changesets/017/R14_PHYSICAL_ATTEMPT1_FAILURE.json':'12db81e4a17749e946b15c0cf3093b34c533153d','docs/changesets/017/R15_STATIC_VALIDATION_FAILURE.json':'d8ebc9390acff0f8452d30389c2d6ea300996472','scripts/dlab/ev00/run_ev00_dlab_windows_r11.ps1':'00cc326fa1c8cd40402c525c877a1af21969ba42','scripts/dlab/ev00/run_ev00_dlab_windows_r12.ps1':'2e9c32a6e342839ebcb7d6d1f71fff26b6f50f3b','scripts/dlab/ev00/run_ev00_dlab_windows_r13.ps1':'47e6cda9567513c9357b20c31e3e5b1b10b2e4c4','scripts/dlab/ev00/run_ev00_dlab_windows_r14.ps1':'2fedf39dc98cf56ff61b990dbac8f4452ff15c0b','scripts/dlab/ev00/run_ev00_dlab_windows_r15.ps1':'2c8f2d41f708dfad27361b1e47774e536b87ade2','scripts/dlab/ev00/verify_ev00_dlab_evidence_r11.py':'b8a87f899350215a80d4eb7dd1dc6cc7e07823f7','scripts/dlab/ev00/verify_ev00_dlab_evidence_r13.py':'325b377c0ae72cd8ad60880ed38a0312bd5e3da1','scripts/dlab/ev00/verify_ev00_dlab_evidence_r14.py':'9714d260fa44de6cbc5476b906054196ecd028fd','scripts/dlab/ev00/verify_ev00_dlab_evidence_r15.py':'6cab62513c717081e4f3f709ad916a850c4244bb'}
          for p,e in hashes.items():
              g=subprocess.run(['git','hash-object',p],text=True,capture_output=True,check=True).stdout.strip()
              if g!=e: raise SystemExit(f'preserved bytes changed: {p} got={g} expected={e}')
          maxima=read('audit/STAGE_SCOPE_MAXIMA.json'); m=next(x for x in maxima['stages'] if x['stage_id']=='EV-00')
          allowed=list(m['allowed_patterns'])+['audit/validation/CS017/**','audit/CURRENT_CHANGESET_VALIDATION.json']; forbidden=list(m['mandatory_forbidden_patterns'])
          for p in subprocess.run(['git','diff','--name-only',f'{BASE}...HEAD'],text=True,capture_output=True,check=True).stdout.splitlines():
              if any(fnmatch.fnmatch(p,q) for q in forbidden): raise SystemExit(f'forbidden path: {p}')
              if not any(fnmatch.fnmatch(p,q) for q in allowed): raise SystemExit(f'out-of-scope path: {p}')
          print('R16 scope/history: PASS')
          PY

      - name: Canonical evolution authorizer self-test
        run: python3 scripts/authorize_evolution_action.py --self-test

      - name: Authorize EV-00 start state
        run: python3 scripts/authorize_evolution_action.py --action start_stage --changeset CS017 --stage EV-00

      - name: Authorize exact R16 harness paths
        run: >-
          python3 scripts/authorize_evolution_action.py --action stage_operation --changeset CS017 --stage EV-00
          --path scripts/dlab/ev00/invoke_ev00_r16.ps1 --path scripts/dlab/ev00/run_ev00_dlab_windows.ps1
          --path scripts/dlab/ev00/run_ev00_dlab_windows_r11.ps1 --path scripts/dlab/ev00/run_ev00_dlab_windows_r12.ps1
          --path scripts/dlab/ev00/run_ev00_dlab_windows_r13.ps1 --path scripts/dlab/ev00/run_ev00_dlab_windows_r14.ps1
          --path scripts/dlab/ev00/run_ev00_dlab_windows_r15.ps1 --path scripts/dlab/ev00/verify_ev00_dlab_evidence.py
          --path scripts/dlab/ev00/verify_ev00_dlab_evidence_r11.py --path scripts/dlab/ev00/verify_ev00_dlab_evidence_r13.py
          --path scripts/dlab/ev00/verify_ev00_dlab_evidence_r14.py --path scripts/dlab/ev00/verify_ev00_dlab_evidence_r15.py
          --path .github/workflows/ev00-dlab.yml --path docs/changesets/017/LOCAL_DLAB_RUNBOOK.md
          --path docs/changesets/017/HISTORICAL_ASSURANCE_PROVENANCE_PLAN.json

      - name: Evidence verifier self-test
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --self-test

      - name: PowerShell harness syntax check
        shell: pwsh
        run: |
          foreach ($p in @('scripts/dlab/ev00/invoke_ev00_r16.ps1','scripts/dlab/ev00/run_ev00_dlab_windows.ps1','scripts/dlab/ev00/run_ev00_dlab_windows_r15.ps1')) {
            $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$null,[ref]$errors)
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error "$p :: $($_.Message)" }; exit 1 }
          }
          Write-Host 'PowerShell syntax: PASS'

      - name: Verify R16 fixture-only correction and dual-surface preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          current=Path('scripts/dlab/ev00/verify_ev00_dlab_evidence.py').read_text(encoding='utf-8')
          snapshot=Path('scripts/dlab/ev00/verify_ev00_dlab_evidence_r15.py').read_text(encoding='utf-8')
          wrapper=Path('scripts/dlab/ev00/invoke_ev00_r16.ps1').read_text(encoding='utf-8')
          if subprocess.run(['git','hash-object','scripts/dlab/ev00/run_ev00_dlab_windows.ps1'],text=True,capture_output=True,check=True).stdout.strip()!='2c8f2d41f708dfad27361b1e47774e536b87ade2': raise SystemExit('R16 runner changed from R15')
          if subprocess.run(['git','hash-object','scripts/dlab/ev00/run_ev00_dlab_windows_r15.ps1'],text=True,capture_output=True,check=True).stdout.strip()!='2c8f2d41f708dfad27361b1e47774e536b87ade2': raise SystemExit('R15 runner snapshot mismatch')
          if subprocess.run(['git','hash-object','scripts/dlab/ev00/verify_ev00_dlab_evidence_r15.py'],text=True,capture_output=True,check=True).stdout.strip()!='6cab62513c717081e4f3f709ad916a850c4244bb': raise SystemExit('R15 verifier snapshot mismatch')
          if subprocess.run(['git','hash-object','scripts/dlab/ev00/verify_ev00_dlab_evidence.py'],text=True,capture_output=True,check=True).stdout.strip()!='b7cff33bbd705f2ba102630899d1ca5fede862f6': raise SystemExit('R16 verifier adapter mismatch')
          if subprocess.run(['git','hash-object','scripts/dlab/ev00/invoke_ev00_r16.ps1'],text=True,capture_output=True,check=True).stdout.strip()!='62ad1a38081ab2778dc2eb3f045cc5f3395cb6c1': raise SystemExit('R16 wrapper mismatch')
          for token in ['verify_ev00_dlab_evidence_r15.py','research_contract_self_test_fixed','started_at_utc','finished_at_utc','r15.check_replay_rollback','r15.module.main()']:
              if token not in current: raise SystemExit(f'R16 fixture adapter token missing: {token}')
          for token in ['EXPECTED_RESEARCH_TESTS','supported-surface configure is not research-OFF','replay/history configure is not research-ON','replay/history surface must be exactly 3/0 and exact names']:
              if token not in snapshot: raise SystemExit(f'R15 runtime verifier token missing: {token}')
          for token in ['Control HEAD must equal canonical R16 plan commit','Assert-DualSurfaceContract','Invoke-VerifierSelfTest','EV00 EVIDENCE VERIFIER SELF-TEST: PASS']:
              if token not in wrapper: raise SystemExit(f'R16 preflight regression guard missing: {token}')
          print('R16 fixture-only correction/runtime preservation: PASS')
          PY

      - name: Verify R16 historical assurance provenance plan
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          PRODUCT='e3fff973554a2e56b8bd7afdc1132f75f3ec337c'
          p=json.loads(Path('docs/changesets/017/HISTORICAL_ASSURANCE_PROVENANCE_PLAN.json').read_text(encoding='utf-8')); rows=p.get('entries',[])
          if p.get('schema')!='neoeng.dlab.ev00-historical-assurance-plan.v1' or p.get('baseline_commit')!=PRODUCT or len(rows)!=15 or {x.get('changeset') for x in rows}!={f'CS{i:03d}' for i in range(1,16)}: raise SystemExit('historical provenance plan coverage/binding mismatch')
          for row in rows:
              commit=row['historical_commit']; cs=row['changeset']
              if subprocess.run(['git','merge-base','--is-ancestor',commit,PRODUCT]).returncode!=0: raise SystemExit(f'commit not in baseline ancestry: {cs}')
              for rel in row['evidence_paths']:
                  if subprocess.run(['git','cat-file','-e',f'{commit}:{rel}']).returncode!=0 or not Path(rel).is_file(): raise SystemExit(f'evidence provenance invalid: {cs} {rel}')
          print('R16 historical assurance provenance: PASS')
          PY

      - name: Verify canonical CS017 validation plan
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('audit/validation/CS017/VALIDATION_PLAN.json',encoding='utf-8')); tests=p.get('required_tests',[]); ids=[x.get('test_id') for x in tests]
          req={'ev00.r16-scope-history','ev00.r16-verifier-fixture-correction','ev00.r16-historical-provenance','ev00.ctest','ev00.replay-rollback','ev00.historical-assurance','ev00.terminal'}
          if p.get('schema')!='neoeng.dcore.changeset-validation-plan.v1' or p.get('changeset')!='CS017' or len(ids)!=len(set(ids)) or any(x.get('required') is not True for x in tests) or not req.issubset(ids) or p.get('acceptance_requires_all_required_pass') is not True or p.get('allow_test_removal_after_execution') is not False: raise SystemExit('R16 plan structure invalid')
          print('CS017 R16 validation plan: PASS')
          PY

      - name: Resolve committed qualifying evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          marker='docs/changesets/017/evidence/local-windows/ACTIVE_LOCAL_RUN.json'
          if [[ ! -f "$marker" ]]; then echo 'active=false' >> "$GITHUB_OUTPUT"; echo 'R16 static plan-frozen mode'; exit 0; fi
          run_id=$(python3 -c "import json; print(json.load(open('$marker',encoding='utf-8'))['run_id'])"); evidence="docs/changesets/017/evidence/local-windows/$run_id"
          [[ -d "$evidence" ]] || { echo "active evidence directory missing: $evidence"; exit 1; }
          echo 'active=true' >> "$GITHUB_OUTPUT"; echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

      - name: Verify plan-commit and harness-SHA binding
        if: steps.evidence.outputs.active == 'true'
        shell: bash
        run: |
          plan_commit=$(git log -n 1 --format=%H HEAD -- audit/validation/CS017/VALIDATION_PLAN.json)
          python3 - '${{ steps.evidence.outputs.evidence }}/run-identity.json' "$plan_commit" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); product='e3fff973554a2e56b8bd7afdc1132f75f3ec337c'
          if p.get('harness_sha')!=sys.argv[2] or p.get('product_sha')!=product or p.get('source_head')!=product: raise SystemExit('plan/product/source binding mismatch')
          PY

      - name: Verify committed physical evidence matrix
        if: steps.evidence.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail; evidence='${{ steps.evidence.outputs.evidence }}'
          for check in source environment fresh-build ctest determinism host-sdk replay-rollback state-evidence support-bundle release-gate manifest historical-comparison terminal; do python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence "$evidence" --repo-root . --check "$check"; done

      - name: Verify CS001-CS015 historical assurance
        if: steps.evidence.outputs.active == 'true'
        shell: bash
        run: |
          result='docs/changesets/017/HISTORICAL_ASSURANCE_RESULT.json'; [[ -f "$result" ]] || { echo 'HISTORICAL_ASSURANCE_RESULT.json required with active evidence'; exit 1; }
          python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence }}' --repo-root . --check historical-assurance

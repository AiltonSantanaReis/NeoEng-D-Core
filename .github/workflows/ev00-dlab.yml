name: EV-00 D-Lab evidence validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/dlab/**'
      - '.github/workflows/ev00-dlab.yml'
      - 'docs/changesets/017/**'
      - 'audit/validation/CS017/**'
      - 'audit/CURRENT_CHANGESET_VALIDATION.json'
      - 'audit/EVOLUTION_ROADMAP.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: EV-00 D-Lab evidence validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify R10 stage scope and R9 failure preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, subprocess
          from pathlib import Path
          BASE='3ebb989c5aaca65501ddbc5e552e1f751079e310'
          PRODUCT='e3fff973554a2e56b8bd7afdc1132f75f3ec337c'
          def read(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def at_base(p):
              return json.loads(subprocess.run(['git','show',f'{BASE}:{p}'],text=True,capture_output=True,check=True).stdout)
          roadmap=read('audit/EVOLUTION_ROADMAP.json'); base=at_base('audit/EVOLUTION_ROADMAP.json')
          def stage(d): return next(x for x in d['stages'] if x['stage_id']=='EV-00')
          if stage(base)['status']!='not_started' or stage(roadmap)['status']!='in_progress':
              raise SystemExit('EV-00 lifecycle transition mismatch')
          normalized=copy.deepcopy(roadmap); stage(normalized)['status']='not_started'
          if normalized != base: raise SystemExit('roadmap changed outside EV-00 not_started -> in_progress')
          if roadmap.get('release_authorized') is not False: raise SystemExit('release_authorized changed')
          maxima=read('audit/STAGE_SCOPE_MAXIMA.json')
          maximum=next(x for x in maxima['stages'] if x['stage_id']=='EV-00')
          scope=read('docs/changesets/017/ACTION_SCOPE.json')
          if scope.get('changeset')!='CS017' or scope.get('stage')!='EV-00' or scope.get('state')!='in_progress':
              raise SystemExit('ACTION_SCOPE identity/lifecycle mismatch')
          if scope.get('control_base_commit')!=BASE: raise SystemExit('ACTION_SCOPE base mismatch')
          if scope.get('allowed_paths')!=maximum.get('allowed_patterns'): raise SystemExit('ACTION_SCOPE allowed paths mismatch')
          if scope.get('forbidden_paths')!=maximum.get('mandatory_forbidden_patterns'): raise SystemExit('ACTION_SCOPE forbidden paths mismatch')
          if scope.get('source_under_test',{}).get('commit')!=PRODUCT: raise SystemExit('SUT mismatch')
          for key in ('runtime_change_authorized','claim_change_authorized','release_authorized','destructive_operations_authorized'):
              if scope.get(key) is not False: raise SystemExit(f'{key} must be false')
          failure=read('docs/changesets/017/R9_PHYSICAL_ATTEMPT1_FAILURE.json')
          if failure.get('classification') is not None:
              raise SystemExit('R9 failure classification must live under qualify.classification')
          q=failure.get('qualify',{})
          if q.get('classification')!='FAILED_HARNESS_INITIALIZATION_BEFORE_TERMINAL_RECORD': raise SystemExit('R9 failure classification mismatch')
          if failure.get('local_run_id')!='ev00-20260822T074919Z-47b2284e': raise SystemExit('R9 local run id mismatch')
          if failure.get('runner_blob')!='00cc326fa1c8cd40402c525c877a1af21969ba42': raise SystemExit('R9 runner binding mismatch')
          runner=subprocess.run(['git','hash-object','scripts/dlab/ev00/run_ev00_dlab_windows.ps1'],text=True,capture_output=True,check=True).stdout.strip()
          if runner!='00cc326fa1c8cd40402c525c877a1af21969ba42': raise SystemExit('preserved runner bytes changed')
          changed=subprocess.run(['git','diff','--name-only',f'{BASE}...HEAD'],text=True,capture_output=True,check=True).stdout.splitlines()
          forbidden=['src/','include/','tests/','cmake/','tools/','examples/','modules/','apps/']
          bad=[p for p in changed if p=='CMakeLists.txt' or any(p.startswith(x) for x in forbidden)]
          if bad: raise SystemExit('product/runtime/build paths changed: '+', '.join(bad))
          print('R10 stage scope and R9 failure preservation: PASS')
          PY

      - name: Canonical evolution authorizer self-test
        run: python3 scripts/authorize_evolution_action.py --self-test

      - name: Authorize EV-00 start state
        run: python3 scripts/authorize_evolution_action.py --action start_stage --changeset CS017 --stage EV-00

      - name: Authorize exact R10 harness paths
        run: >-
          python3 scripts/authorize_evolution_action.py
          --action stage_operation --changeset CS017 --stage EV-00
          --path scripts/dlab/ev00/invoke_ev00_r10.ps1
          --path scripts/dlab/ev00/run_ev00_dlab_windows.ps1
          --path scripts/dlab/ev00/verify_ev00_dlab_evidence.py
          --path .github/workflows/ev00-dlab.yml
          --path docs/changesets/017/LOCAL_DLAB_RUNBOOK.md
          --path docs/changesets/017/R9_PHYSICAL_ATTEMPT1_FAILURE.json

      - name: Evidence verifier self-test
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --self-test

      - name: PowerShell harness syntax check
        shell: pwsh
        run: |
          foreach ($path in @('scripts/dlab/ev00/invoke_ev00_r10.ps1','scripts/dlab/ev00/run_ev00_dlab_windows.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)
            if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          Write-Host 'PowerShell syntax: PASS'

      - name: Verify R10 named-branch plan guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('scripts/dlab/ev00/invoke_ev00_r10.ps1').read_text(encoding='utf-8')
          required=[
            'git -C $ControlRepo log -n 1 --format=%H -- audit/validation/CS017/VALIDATION_PLAN.json',
            'if ($head -ne $planCommit)',
            'git -C $ControlRepo branch --show-current',
            'detached HEAD is prohibited',
            'git -C $ControlRepo status --porcelain',
            "run_ev00_dlab_windows.ps1",
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('R10 guard missing: '+repr(missing))
          if '.Trim()' in next(line for line in text.splitlines() if 'branch --show-current' in line and '$branch' in line):
              # Safe because branch output is first normalized through Out-String in the same expression.
              line=next(line for line in text.splitlines() if 'branch --show-current' in line and '$branch' in line)
              if '| Out-String' not in line: raise SystemExit('branch guard can still Trim null output')
          print('R10 named-branch plan guard: PASS')
          PY

      - name: Verify canonical CS017 validation plan
        run: python3 scripts/verify_changeset_validation.py --plan audit/validation/CS017/VALIDATION_PLAN.json

      - name: Resolve committed qualifying evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f docs/changesets/017/ACTIVE_LOCAL_RUN.json ]]; then
            echo 'mode=plan-frozen' >> "$GITHUB_OUTPUT"
            echo 'R10 plan frozen; awaiting physical Windows evidence.'
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc=json.loads(Path('docs/changesets/017/ACTIVE_LOCAL_RUN.json').read_text(encoding='utf-8'))
          if doc.get('schema')!='neoeng.dcore.ev00-active-local-run.v1': raise SystemExit('ACTIVE_LOCAL_RUN schema mismatch')
          run_id=doc.get('run_id'); evidence=doc.get('evidence_path')
          if not isinstance(run_id,str) or not run_id.startswith('ev00-'): raise SystemExit('invalid active local run_id')
          expected=f'docs/changesets/017/evidence/local-windows/{run_id}'
          if evidence!=expected or not Path(evidence).is_dir(): raise SystemExit('active evidence path mismatch/missing')
          if doc.get('terminal_state')!='PASSED': raise SystemExit('active local run is not terminal PASSED')
          print('mode=evidence'); print(f'evidence_path={evidence}'); print(f'run_id={run_id}')
          PY

      - name: Verify plan-commit and harness-SHA binding
        if: steps.evidence.outputs.mode == 'evidence'
        shell: bash
        env:
          EVIDENCE_PATH: ${{ steps.evidence.outputs.evidence_path }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          plan='audit/validation/CS017/VALIDATION_PLAN.json'
          ev=Path(os.environ['EVIDENCE_PATH'])
          identity=json.loads((ev/'run-identity.json').read_text(encoding='utf-8'))
          active=json.loads(Path('docs/changesets/017/ACTIVE_LOCAL_RUN.json').read_text(encoding='utf-8'))
          pc=subprocess.run(['git','log','-n','1','--format=%H','--',plan],text=True,capture_output=True,check=True).stdout.strip()
          if identity.get('harness_sha')!=pc or active.get('harness_sha')!=pc: raise SystemExit('plan/harness binding mismatch')
          if active.get('product_sha')!='e3fff973554a2e56b8bd7afdc1132f75f3ec337c': raise SystemExit('ACTIVE_LOCAL_RUN product mismatch')
          print('plan/harness binding: PASS',pc)
          PY

      - name: Verify protected source identity
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check source

      - name: Verify physical Windows environment
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check environment

      - name: Verify fresh isolated build
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check fresh-build

      - name: Verify supported CTest surface
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check ctest

      - name: Verify deterministic repeat probe
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check determinism

      - name: Verify Host SDK boundary
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check host-sdk

      - name: Verify replay and rollback surface
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check replay-rollback

      - name: Verify state evidence probe
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check state-evidence

      - name: Verify support bundle probe
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check support-bundle

      - name: Verify historical release-gate revalidation
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check release-gate

      - name: Verify SHA-256 evidence manifest
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check manifest

      - name: Verify historical CTest comparison
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check historical-comparison

      - name: Verify local terminal state
        if: steps.evidence.outputs.mode == 'evidence'
        run: python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py --evidence '${{ steps.evidence.outputs.evidence_path }}' --repo-root . --check terminal

      - name: Verify CS001-CS015 historical assurance
        if: steps.evidence.outputs.mode == 'evidence'
        run: >-
          python3 scripts/dlab/ev00/verify_ev00_dlab_evidence.py
          --evidence '${{ steps.evidence.outputs.evidence_path }}'
          --repo-root .
          --historical-result docs/changesets/017/HISTORICAL_ASSURANCE_RESULT.json
          --check historical-assurance

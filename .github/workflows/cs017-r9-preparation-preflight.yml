name: CS017 R9 preparation preflight (NON-QUALIFYING)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/changesets/017/**'
      - 'audit/EVOLUTION_ROADMAP.json'
      - '.github/workflows/cs017-r9-preparation-preflight.yml'

permissions:
  contents: read

jobs:
  preparation:
    name: CS017 R9 non-qualifying preparation preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify R9 preparation state and exact current ACTION_SCOPE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, subprocess
          from pathlib import Path

          BASE = '3ebb989c5aaca65501ddbc5e552e1f751079e310'
          PRODUCT = 'e3fff973554a2e56b8bd7afdc1132f75f3ec337c'

          def read(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def at_base(path):
              p = subprocess.run(['git','show',f'{BASE}:{path}'], text=True, capture_output=True, check=True)
              return json.loads(p.stdout)

          base_roadmap = at_base('audit/EVOLUTION_ROADMAP.json')
          current = read('audit/EVOLUTION_ROADMAP.json')
          if base_roadmap.get('current_stage') != 'EV-00' or current.get('current_stage') != 'EV-00':
              raise SystemExit('current_stage must remain EV-00')
          if current.get('release_authorized') is not False:
              raise SystemExit('release_authorized changed')

          def stage(doc, sid):
              return next(row for row in doc['stages'] if row['stage_id'] == sid)

          if stage(base_roadmap,'EV-00')['status'] != 'not_started':
              raise SystemExit('trusted base EV-00 was not not_started')
          if stage(current,'EV-00')['status'] != 'in_progress':
              raise SystemExit('R9 EV-00 must be in_progress')
          normalized = copy.deepcopy(current)
          stage(normalized,'EV-00')['status'] = 'not_started'
          if normalized != base_roadmap:
              raise SystemExit('roadmap changed outside EV-00 not_started -> in_progress')

          maxima = read('audit/STAGE_SCOPE_MAXIMA.json')
          maximum = next(row for row in maxima['stages'] if row['stage_id'] == 'EV-00')
          scope = read('docs/changesets/017/ACTION_SCOPE.json')
          if scope.get('schema') != 'neoeng.dcore.changeset-action-scope.v1':
              raise SystemExit('ACTION_SCOPE schema mismatch')
          if scope.get('changeset') != 'CS017' or scope.get('stage') != 'EV-00' or scope.get('state') != 'in_progress':
              raise SystemExit('ACTION_SCOPE lifecycle binding mismatch')
          if scope.get('control_base_commit') != BASE:
              raise SystemExit('ACTION_SCOPE control base mismatch')
          sut = scope.get('source_under_test', {})
          if sut.get('release_tag') != 'v1.14.1' or sut.get('commit') != PRODUCT or sut.get('immutable_during_qualifying_run') is not True:
              raise SystemExit('ACTION_SCOPE source-under-test mismatch')
          if scope.get('allowed_paths') != maximum.get('allowed_patterns'):
              raise SystemExit('ACTION_SCOPE allowed paths differ from current EV-00 maximum')
          if scope.get('forbidden_paths') != maximum.get('mandatory_forbidden_patterns'):
              raise SystemExit('ACTION_SCOPE forbidden paths differ from current EV-00 mandatory set')
          for key in ('runtime_change_authorized','claim_change_authorized','release_authorized','destructive_operations_authorized'):
              if scope.get(key) is not False:
                  raise SystemExit(f'{key} must be false')
          if scope.get('stage_operation_requires_authorization') is not True:
              raise SystemExit('stage_operation authorization requirement missing')

          expected_blobs = {
              'docs/changesets/017/R5_FAILURE_RECORD.json': '02012335696e2fcfeba1516f61f79e15cdd588c5',
              'docs/changesets/017/R6_FAILURE_RECORD.json': '9906b34cc95b50fec8665d482ce77b89a9c304fb',
              'docs/changesets/017/R7_PREPARATION_RECORD.json': 'a794910318fe4e8bec38eb804e7e5a011a05c979',
              'audit/validation/CS000H/R8_PREPARATION_FAILURE.json': '3dc4e97d9e92b71f70af3386412e13d73df2c262',
              'scripts/authorize_evolution_action.py': '0316e2659e3284cbf2a45f816c0f2e958bd3674e',
          }
          for path, expected in expected_blobs.items():
              got = subprocess.run(['git','hash-object',path], text=True, capture_output=True, check=True).stdout.strip()
              if got != expected:
                  raise SystemExit(f'preserved control/history bytes changed: {path} {got} != {expected}')

          record = read('docs/changesets/017/R9_PREPARATION_RECORD.json')
          if record.get('revision') != 'R9' or record.get('qualification_state') != 'NOT_STARTED':
              raise SystemExit('R9 preparation record state mismatch')
          if record.get('qualifying_run_started') is not False or record.get('local_evidence_reused') is not False:
              raise SystemExit('R9 preparation record claims qualifying execution/reuse')
          print('R9 preparation state and ACTION_SCOPE: PASS')
          PY

      - name: Canonical evolution authorizer self-test
        run: python3 scripts/authorize_evolution_action.py --self-test

      - name: Authorize EV-00 start state
        run: >-
          python3 scripts/authorize_evolution_action.py
          --action start_stage
          --changeset CS017
          --stage EV-00

      - name: Pre-authorize exact R9 harness publication paths
        run: >-
          python3 scripts/authorize_evolution_action.py
          --action stage_operation
          --changeset CS017
          --stage EV-00
          --path scripts/dlab/ev00/run_ev00_dlab_windows.ps1
          --path scripts/dlab/ev00/verify_ev00_dlab_evidence.py
          --path .github/workflows/ev00-dlab.yml
          --path docs/changesets/017/LOCAL_DLAB_RUNBOOK.md

      - name: Verify combined stage and control-plane scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch, json, subprocess
          from pathlib import Path

          BASE = '3ebb989c5aaca65501ddbc5e552e1f751079e310'
          maxima = json.loads(Path('audit/STAGE_SCOPE_MAXIMA.json').read_text(encoding='utf-8'))
          maximum = next(row for row in maxima['stages'] if row['stage_id'] == 'EV-00')
          stage_allowed = list(maximum['allowed_patterns'])
          forbidden = list(maximum['mandatory_forbidden_patterns'])
          control_allowed = ['.github/workflows/cs017-r9-preparation-preflight.yml']
          p = subprocess.run(['git','diff','--name-only',f'{BASE}...HEAD'], text=True, capture_output=True, check=True)
          changed = [x for x in p.stdout.splitlines() if x]
          if not changed:
              raise SystemExit('empty CS017 R9 preparation diff')
          for path in changed:
              if any(fnmatch.fnmatch(path, pat) for pat in forbidden):
                  raise SystemExit(f'forbidden EV-00 path changed: {path}')
              if not any(fnmatch.fnmatch(path, pat) for pat in stage_allowed + control_allowed):
                  raise SystemExit(f'path belongs to neither EV-00 scope nor R9 preparation control plane: {path}')
          product = subprocess.run(
              ['git','diff','--name-only',f'{BASE}...HEAD','--','src','include','tests','cmake','tools','examples','modules','apps','CMakeLists.txt'],
              text=True, capture_output=True, check=True).stdout.strip()
          if product:
              raise SystemExit('product/runtime/build surface changed:\n' + product)
          print('R9 combined preparation scope: PASS')
          for path in changed:
              print(' -', path)
          PY

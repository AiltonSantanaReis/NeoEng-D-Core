name: CS000L EV-03 ledger closure

on:
  push:
    branches:
      - agent/cs000l-ev03-ledger-closure
    paths:
      - '.github/workflows/cs000l-ev03-ledger-closure-validation.yml'
      - 'audit/EVOLUTION_REQUIREMENTS_TRACEABILITY.json'
      - 'audit/EVOLUTION_ROADMAP.json'
      - 'audit/validation/CS000L/VALIDATION_PLAN.json'
      - 'docs/changesets/000L/CHANGESET.md'
      - 'docs/changesets/000L/evidence/EV03_ACCEPTANCE_MANIFEST.json'
      - 'docs/records/evolution/DEV-0012.md'
      - 'scripts/verify_cs000l_ev03_ledger_closure.py'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate:
    name: CS000L EV-03 ledger closure
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact CS000L source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000L verifier negative self-test
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --self-test

      - name: Verify prospective governance authority
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --authority

      - name: Verify accepted CS020 protected integration
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --integration

      - name: Verify live CS020 and post-merge provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --github

      - name: Verify accepted CS000K predecessor preservation
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --predecessor

      - name: Verify immutable EV-03 golden corpus preservation
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --golden

      - name: Verify exact EV-03 ledger closure
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --ledger

      - name: Verify EVREQ-013 through EVREQ-015
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --requirements

      - name: Verify EV-03 acceptance evidence and decision
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --evidence

      - name: Verify CS000L administrative-only scope
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --scope

      - name: Verify no product release or EV-04 effects
        run: python3 -B scripts/verify_cs000l_ev03_ledger_closure.py --non-effects

      - name: Verify evolution ledger
        run: |
          python3 -B scripts/verify_evolution_plan.py
          python3 -B scripts/verify_evolution_plan.py --self-test

      - name: Verify tracked-file manifest
        run: python3 -B scripts/generate_manifest.py --check

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000L/VALIDATION_PLAN.json
          --expected-base-sha 0adf4721ebefb77723e2c59ee042f35fb291854a

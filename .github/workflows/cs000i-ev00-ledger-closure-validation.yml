name: CS000I EV-00 ledger closure

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate:
    name: CS000I EV-00 ledger closure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000I verifier negative self-test
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --self-test

      - name: Verify accepted CS017 integration binding
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --integration

      - name: Verify live GitHub acceptance provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --github

      - name: Verify R22 workflow is manual-only
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --workflow-retirement

      - name: Verify exact EV-00 ledger closure
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --ledger

      - name: Verify EVREQ-001 through EVREQ-004
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --requirements

      - name: Verify EV-00 acceptance evidence and decision
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --evidence

      - name: Verify CS000I administrative-only scope
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --scope

      - name: Verify no product release or EV-01 effects
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --non-effects

      - name: Verify evolution ledger
        run: python3 -B scripts/verify_evolution_plan.py

      - name: Verify EV-00 advance authorization boundary
        run: >-
          python3 -B scripts/authorize_evolution_action.py
          --action advance_stage
          --changeset CS017
          --stage EV-00

      - name: Verify tracked-file manifest
        run: python3 -B scripts/verify_cs000i_ev00_ledger_closure.py --manifest

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000I/VALIDATION_PLAN.json

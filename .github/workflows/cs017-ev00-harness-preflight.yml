name: CS017 EV-00 harness preflight (NON-QUALIFYING)

on:
  push:
    branches:
      - agent/cs017-ev00-baseline-certification-r7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-harness-static:
    name: NON-QUALIFYING Windows harness static checks
    runs-on: windows-latest
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse PowerShell harness
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/ev00/run_ev00_dlab_windows.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PowerShell parser: PASS'
      - name: Verify local-only qualification guardrails
        shell: pwsh
        run: |
          $text = Get-Content 'scripts/ev00/run_ev00_dlab_windows.ps1' -Raw
          $required = @(
            "[ValidateSet('Preflight','Qualify')]",
            "EV-00 qualifying laboratory requires physical Windows",
            "PowerShell 7+",
            "e3fff973554a2e56b8bd7afdc1132f75f3ec337c",
            "`$EvidenceRoot = Join-Path `$RunRoot 'evidence'",
            "preexisting_build_used = `$false",
            "Write-EvidenceManifest `$EvidenceRoot",
            "No result is accepted until the independent verifier and Trusted ChangeSet validation gate pass",
            "-Arguments @('/d','/c','bootstrap-vcpkg.bat','-disableMetrics') -WorkingDirectory `$VcpkgDir",
            '[Parameter(Mandatory=$true)][AllowEmptyCollection()][string[]]$Arguments'
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              Write-Error "Missing guardrail token: $needle"
              exit 1
            }
          }
          if ($text -match '(?im)^\s*\$host\s*=') {
            Write-Error 'Harness must not assign to PowerShell automatic variable $Host/$host.'
            exit 1
          }
          if ($text.Contains('$bootstrapCommand')) {
            Write-Error 'Harness must not reconstruct the vcpkg batch command through a manually quoted command string.'
            exit 1
          }
          Write-Host 'Local-only qualification guardrails: PASS'
      - name: Reproduce R5 quoting class with safe invocation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'neoeng cmd path with spaces'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $batch = Join-Path $root 'bootstrap-vcpkg.bat'
          $batchText = @'
          @echo off
          if "%1"=="-disableMetrics" (
            echo CMD_BOOTSTRAP_OK
            exit /b 0
          )
          echo BAD_ARG:%1
          exit /b 7
          '@
          [System.IO.File]::WriteAllText($batch, $batchText, [System.Text.Encoding]::ASCII)

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = 'cmd.exe'
          $psi.WorkingDirectory = $root
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          foreach ($argument in @('/d','/c','bootstrap-vcpkg.bat','-disableMetrics')) {
            [void]$psi.ArgumentList.Add($argument)
          }
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $psi
          if (-not $process.Start()) { throw 'Unable to start cmd.exe regression process.' }
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $exitCode = $process.ExitCode
          $process.Dispose()
          Write-Host $stdout
          if (-not [string]::IsNullOrWhiteSpace($stderr)) { Write-Host $stderr }
          if ($exitCode -ne 0 -or -not $stdout.Contains('CMD_BOOTSTRAP_OK')) {
            Write-Error "cmd.exe batch invocation regression failed: exit=$exitCode stdout=$stdout stderr=$stderr"
            exit 1
          }
          Write-Host 'cmd.exe batch invocation regression: PASS'
      - name: Reproduce R6 zero-argument binding class
        shell: pwsh
        run: |
          $text = Get-Content 'scripts/ev00/run_ev00_dlab_windows.ps1' -Raw
          $needle = '[Parameter(Mandatory=$true)][AllowEmptyCollection()][string[]]$Arguments'
          if (-not $text.Contains($needle)) {
            Write-Error 'Invoke-RecordedCommand must explicitly allow an empty Arguments collection.'
            exit 1
          }

          function Test-ZeroArgumentBinding {
            param([Parameter(Mandatory=$true)][AllowEmptyCollection()][string[]]$Arguments)
            return @($Arguments).Count
          }

          $count = Test-ZeroArgumentBinding -Arguments @()
          if ($count -ne 0) {
            Write-Error "Zero-argument binding regression failed: count=$count"
            exit 1
          }
          Write-Host 'R6 zero-argument binding regression: PASS'

  verifier-selftest:
    name: NON-QUALIFYING EV-00 verifier self-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile scripts/ev00/verify_ev00_dlab_evidence.py
      - name: Negative self-test
        run: python3 scripts/ev00/verify_ev00_dlab_evidence.py --self-test

  preparation-scope:
    name: NON-QUALIFYING preparation scope check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject product/runtime changes
        shell: bash
        run: |
          set -euo pipefail
          base='d092ac56290d76dddf51982549a98234f038f3ee'
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          printf 'Preparation paths:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              docs/changesets/017/*|scripts/ev00/*|.github/workflows/cs017-ev00-harness-preflight.yml|.github/workflows/cs017-ev00-validation.yml|audit/validation/CS017/*|audit/CURRENT_CHANGESET_VALIDATION.json)
                ;;
              *)
                echo "Unexpected preparation path: $path" >&2
                exit 1
                ;;
            esac
          done
          if git diff --name-only "$base"...HEAD -- src include CMakeLists.txt CMakePresets.json vcpkg.json modules tests apps | grep -q .; then
            echo 'Product/runtime/build surface changed during EV-00 preparation.' >&2
            exit 1
          fi
          echo 'Preparation scope: PASS'

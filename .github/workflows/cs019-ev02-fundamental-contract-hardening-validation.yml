name: CS019 EV-02 fundamental contract hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cs019-ev02-fundamental-contract-hardening-validation.yml"
      - "MANIFEST.sha256"
      - "audit/CURRENT_CHANGESET_VALIDATION.json"
      - "audit/EVOLUTION_REQUIREMENTS_TRACEABILITY.json"
      - "audit/EVOLUTION_ROADMAP.json"
      - "audit/validation/CS019/VALIDATION_PLAN.json"
      - "docs/changesets/019/CHANGESET.md"
      - "docs/contracts/FUNDAMENTAL_TRANSITION_V1.md"
      - "include/neoeng/core/simulation.hpp"
      - "modules/host_sdk/tests/host_sdk_tests.cpp"
      - "scripts/verify_cs019_ev02_fundamental_contracts.py"
      - "src/rollback.cpp"
      - "src/simulation.cpp"
      - "tests/numeric_closure_tests.cpp"
      - "tests/test_main.cpp"

permissions:
  contents: read

jobs:
  validation:
    name: CS019 validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev ninja-build gcc g++ clang

      - name: CS019 verifier negative self-test
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --self-test

      - name: Verify prospective governance authority
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --authority

      - name: Verify EV-02 planning ledger
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --planning

      - name: Verify exact CS019 source scope
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --scope

      - name: Verify frozen reference surfaces
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --references

      - name: Verify CS019 workflow contract
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --workflow

      - name: Verify CS019 non-effects
        run: python3 scripts/verify_cs019_ev02_fundamental_contracts.py --non-effects

      - name: Verify evolution ledger
        run: python3 scripts/verify_evolution_plan.py

      - name: Verify ChangeSet policy self-test
        run: python3 scripts/verify_changeset_validation.py --self-test

      - name: Verify ChangeSet validation plan
        run: >-
          python3 scripts/verify_changeset_validation.py
          --plan audit/validation/CS019/VALIDATION_PLAN.json
          --expected-base-sha bf3051abdb084273540e6caeb72329eafa0a2eea

      - name: Verify tracked-file manifest
        run: python3 scripts/generate_manifest.py --check

      - name: Configure primary product regression
        run: >-
          cmake -S . -B build/cs019-primary -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DNEOENG_WARNINGS_AS_ERRORS=ON
          -DNEOENG_DCORE_BUILD_FULL_TOOLSET=OFF
          -DNEOENG_DCORE_BUILD_RELEASE_TOOLS=ON
          -DNEOENG_DCORE_BUILD_RESEARCH_TOOLS=OFF
          -DNEOENG_DCORE_BUILD_VIEW_LAB=OFF

      - name: Build primary product regression
        run: cmake --build build/cs019-primary --parallel 2

      - name: Run fundamental core tests
        run: >-
          ctest --test-dir build/cs019-primary
          --output-on-failure
          -R '^(neoeng_tests|neoeng_numeric_closure_tests|neoeng_host_sdk_tests)$'

      - name: Run product smoke regression
        run: >-
          ctest --test-dir build/cs019-primary
          --output-on-failure -L smoke

  cross_compiler:
    name: CS019 cross-compiler negative corpus
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev ninja-build gcc g++ clang

      - name: Configure GCC fundamental corpus
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build/cs019-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DNEOENG_WARNINGS_AS_ERRORS=ON
          -DNEOENG_DCORE_BUILD_FULL_TOOLSET=OFF
          -DNEOENG_DCORE_BUILD_RELEASE_TOOLS=OFF
          -DNEOENG_DCORE_BUILD_RESEARCH_TOOLS=OFF
          -DNEOENG_DCORE_BUILD_VIEW_LAB=OFF

      - name: Build GCC fundamental corpus
        run: >-
          cmake --build build/cs019-gcc
          --target neoeng_tests neoeng_numeric_closure_tests neoeng_host_sdk_tests
          --parallel 2

      - name: Run GCC fundamental rejection corpus
        run: |
          mkdir -p artifacts/cs019-gcc
          build/cs019-gcc/neoeng_tests | tee artifacts/cs019-gcc/core.txt
          build/cs019-gcc/neoeng_numeric_closure_tests | tee artifacts/cs019-gcc/numeric.txt
          build/cs019-gcc/modules/host_sdk/neoeng_host_sdk_tests | tee artifacts/cs019-gcc/host.txt

          grep '^cs019_core_contract=PASS frame_max=overflow_rejected unknown_entity=not_found rollback_precommit=preserved$' \
            artifacts/cs019-gcc/core.txt > artifacts/cs019-gcc/corpus.txt
          grep '^cs019_q32_contract=PASS rounding=toward_zero overflow=overflow_error division_by_zero=domain_error narrowing=overflow_error$' \
            artifacts/cs019-gcc/numeric.txt >> artifacts/cs019-gcc/corpus.txt
          grep '^cs019_host_contract=PASS frame_max=numeric_overflow unknown_entity=not_found abi=1.0$' \
            artifacts/cs019-gcc/host.txt >> artifacts/cs019-gcc/corpus.txt

          test "$(wc -l < artifacts/cs019-gcc/corpus.txt)" -eq 3

      - name: Configure Clang fundamental corpus
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/cs019-clang -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DNEOENG_WARNINGS_AS_ERRORS=ON
          -DNEOENG_DCORE_BUILD_FULL_TOOLSET=OFF
          -DNEOENG_DCORE_BUILD_RELEASE_TOOLS=OFF
          -DNEOENG_DCORE_BUILD_RESEARCH_TOOLS=OFF
          -DNEOENG_DCORE_BUILD_VIEW_LAB=OFF

      - name: Build Clang fundamental corpus
        run: >-
          cmake --build build/cs019-clang
          --target neoeng_tests neoeng_numeric_closure_tests neoeng_host_sdk_tests
          --parallel 2

      - name: Run Clang fundamental rejection corpus
        run: |
          mkdir -p artifacts/cs019-clang
          build/cs019-clang/neoeng_tests | tee artifacts/cs019-clang/core.txt
          build/cs019-clang/neoeng_numeric_closure_tests | tee artifacts/cs019-clang/numeric.txt
          build/cs019-clang/modules/host_sdk/neoeng_host_sdk_tests | tee artifacts/cs019-clang/host.txt

          grep '^cs019_core_contract=PASS frame_max=overflow_rejected unknown_entity=not_found rollback_precommit=preserved$' \
            artifacts/cs019-clang/core.txt > artifacts/cs019-clang/corpus.txt
          grep '^cs019_q32_contract=PASS rounding=toward_zero overflow=overflow_error division_by_zero=domain_error narrowing=overflow_error$' \
            artifacts/cs019-clang/numeric.txt >> artifacts/cs019-clang/corpus.txt
          grep '^cs019_host_contract=PASS frame_max=numeric_overflow unknown_entity=not_found abi=1.0$' \
            artifacts/cs019-clang/host.txt >> artifacts/cs019-clang/corpus.txt

          test "$(wc -l < artifacts/cs019-clang/corpus.txt)" -eq 3

      - name: Compare cross-compiler rejection corpus
        run: >-
          diff -u
          artifacts/cs019-gcc/corpus.txt
          artifacts/cs019-clang/corpus.txt

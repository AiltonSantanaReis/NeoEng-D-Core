name: CS000P EV-05 scope authorization

on:
  push:
    branches:
      - agent/cs000p-ev05-scope-authorization
    paths:
      - '.github/workflows/cs000p-ev05-scope-authorization-validation.yml'
      - 'audit/STAGE_SCOPE_MAXIMA.json'
      - 'audit/validation/CS000P/VALIDATION_PLAN.json'
      - 'docs/changesets/000P/CHANGESET.md'
      - 'docs/records/evolution/DEV-0016.md'
      - 'scripts/verify_cs000p_ev05_scope_authorization.py'

permissions:
  contents: read

jobs:
  validate:
    name: CS000P EV-05 scope authorization
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact CS000P source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: CS000P verifier negative self-test
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --self-test

      - name: Verify prospective ChangeSet authority
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --authority

      - name: Verify stage-scope conflict reconciliation
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --reconciliation

      - name: Verify exact EV-05 maximum definition
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --scope-ledger

      - name: Verify accepted CS000O predecessor preservation
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --predecessor

      - name: Verify EV-05 and CS022 remain not started
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --nonstart

      - name: Verify CS000P source descriptor geometry
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --descriptor

      - name: Verify exact CS000P administrative scope
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --scope

      - name: Verify CS000P product non-effects
        run: python3 -B scripts/verify_cs000p_ev05_scope_authorization.py --non-effects

      - name: Verify evolution ledger
        run: |
          python3 -B scripts/verify_evolution_plan.py
          python3 -B scripts/verify_evolution_plan.py --self-test

      - name: Verify tracked-file manifest
        run: python3 -B scripts/generate_manifest.py --check

      - name: Verify ChangeSet validation plan
        run: >-
          python3 -B scripts/verify_changeset_validation.py
          --plan audit/validation/CS000P/VALIDATION_PLAN.json
          --expected-base-sha ca3746d7af4476387d269e2dfbe1e9677bd670cb

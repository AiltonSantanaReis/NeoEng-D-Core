name: Trusted governance root

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  trusted-root:
    name: Trusted governance root gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted base for pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout candidate as data only
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Verify candidate with trusted base verifier
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          set -euo pipefail
          # Security boundary: only scripts from ./trusted are executed. Candidate files are read as data.
          python3 trusted/scripts/verify_governance_root.py \
            --trusted-root trusted \
            --candidate-root candidate \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}"

      - name: Verify accepted-history provenance with trusted verifier
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/verify_github_evidence.py --root candidate --repo "${GITHUB_REPOSITORY}"

      - name: Verify steady-state repository protection
        if: github.event_name == 'pull_request_target'
        env:
          GOVERNANCE_ADMIN_TOKEN: ${{ secrets.GOVERNANCE_ADMIN_TOKEN }}
        run: python3 trusted/scripts/verify_repository_protection.py --phase steady --repo "${GITHUB_REPOSITORY}"

      - name: Checkout exact main source
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trusted root self-test
        if: github.event_name != 'pull_request_target'
        run: python3 scripts/verify_governance_root.py --self-test

      - name: Verify main root state
        if: github.event_name != 'pull_request_target'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD)"
          fi
          python3 scripts/verify_governance_root.py \
            --candidate-root . --trusted-root . \
            --base-sha "$BASE" --head-sha "$(git rev-parse HEAD)"

      - name: Verify main accepted-history provenance
        if: github.event_name != 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_github_evidence.py --repo "${GITHUB_REPOSITORY}"

      - name: Verify main steady-state protection
        if: github.event_name != 'pull_request_target'
        env:
          GOVERNANCE_ADMIN_TOKEN: ${{ secrets.GOVERNANCE_ADMIN_TOKEN }}
        run: python3 scripts/verify_repository_protection.py --phase steady --repo "${GITHUB_REPOSITORY}"
